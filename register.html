<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.1/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <script type="module" src="src/js/auth/register.js"></script>

    <title>Register</title>
  </head>
  <style>
    input[type="file"]::-webkit-file-upload-button {
      background-color: #f9fafb;
      color: #111827;
      border-right: 1px solid #d1d5db;
      border-radius: 4px;
    }

    input[type="file"]::-webkit-file-upload-button:hover {
      background-color: #e5e7eb;
    }
  </style>
  <body>
    <div class="centerContainer shadow-xl px-10 py-4">
      <form id="register_form">
        <div class="flex items-center justify-center mb-4">
          <h1
            class="text-2xl font-bold text-gray-900 light:text-white customTextColor"
          >
            Create a new account
          </h1>
        </div>
        <div class="mb-3">
          <label
            for="first_name"
            id="fullname"
            class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >Full name</label
          >
          <input
            type="text"
            id="first_name"
            name="fullname"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
            placeholder="Enter full name"
            required
          />
        </div>
        <div class="grid gap-6 mb-4 md:grid-cols-2">
          <div>
            <label
              for="role"
              class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >
              Role
            </label>
            <select
              id="role"
              name="role"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
              required
            >
              <option value="" disabled selected>Select a role</option>
              <option value="service provider">Service Provider</option>
              <option value="customer">Customer</option>
            </select>
          </div>

          <div>
            <label
              for="phone"
              id="phonenumber"
              class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
              >Phone number</label
            >
            <input
              type="tel"
              id="phone"
              name="phone_number"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
              placeholder="912-3456-678"
              required
            />
          </div>
        </div>
        <div class="mb-4">
          <label
            for="company"
            id="profilepicture"
            class="block mb-2 text-sm font-medium text-gray-900"
            >Profile picture</label
          >
          <input
            type="file"
            id="company"
            name="profile_picture"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full"
            required
          />
        </div>

        <div class="mb-4">
          <label
            for="email"
            id="ownerEmail"
            class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >Email address</label
          >
          <input
            type="email"
            id="email"
            name="email"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
            placeholder="example@anything.com"
            required
          />
        </div>
        <div class="mb-4">
          <label
            for="password"
            class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >Password</label
          >

          <input
            type="password"
            id="password"
            name="password"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
            placeholder="Enter your password"
            required
          />
        </div>
        <div class="mb-4">
          <label
            for="confirm_password"
            class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >Confirm password</label
          >
          <input
            type="password"
            id="confirm_password"
            name="password_confirmation"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
            placeholder="Confirm password"
            required
          />
        </div>
        <div class="flex items-start mb-4">
          <div class="flex items-center h-5">
            <input
              id="remember"
              type="checkbox"
              value=""
              class="w-4 h-4 border border-gray-300 rounded-sm bg-gray-50 focus:ring-3 focus:ring-blue-300 light:bg-gray-700 light:border-gray-600 light:focus:ring-blue-600 light:ring-offset-gray-800"
              required
            />
          </div>
          <label
            for="remember"
            class="ms-2 text-sm font-medium text-gray-900 light:text-gray-300"
            >I agree with the
            <a href="#" class="customTextColor hover:underline"
              >terms and conditions</a
            >.</label
          >
        </div>
        <button
          type="submit"
          class="customBg text-white w-full mb-2 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm: px-5 py-2.5 text-center light:bg-blue-600 light:hover:bg-blue-700 light:focus:ring-blue-800"
        >
          Create an account
        </button>
        <div class="text-center text-sm text-gray-600">
          Already have an account?
          <a href="index.html" class="customTextColor hover:underline"
            >Sign in</a
          >.
        </div>
      </form>
    </div>
    <script>
      const selectedRole = document.getElementById("role");
      selectedRole.addEventListener("change", function () {
        const selectedValue = selectedRole.value;
        const phoneInput = document.getElementById("phonenumber");
        const profile_picture = document.getElementById("profilepicture");
        const fullname = document.getElementById("fullname");
        const email = document.getElementById("ownerEmail");

        if (selectedValue === "service provider") {
          phoneInput.innerText = "Business phone number";
          profile_picture.innerText = "Business logo";
          fullname.innerText = "Owner full name";
          email.innerText = "Owner email address";
        } else {
          phoneInput.innerText = "Phone number";
          profile_picture.innerText = "Profile picture";
          fullname.innerText = "Full name";
          email.innerText = "Email address";
        }
      });
    </script>
  </body>
</html>
