    <!-- Include Flowbite -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/1.6.5/flowbite.min.js"></script>

    <div class="max-w-6xl mx-auto p-6 bg-white rounded-lg">
      <!-- Title and Sorting Dropdown -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold">Notifications</h2>
        <!-- mark as read button -->
        <div>
          <button
            id="markAllAsReadBtn"
            class="border border-gray-300 text-xs px-3 py-1 rounded-full text-gray-500 hover:text-gray-800 hover:border-gray-400"
          >
            Mark as read
          </button>
          <select id="sortNotifications" class="border-0 rounded-lg text-xs">
            <option value="all">Sort by Type</option>
            <option value="booking">Bookings</option>
            <option value="reminder">Reminders</option>
            <option value="payment">Payments</option>
          </select>
        </div>
      </div>

      <!-- Notifications List -->
      <div id="notifications_container" class="space-y-1">
        <!-- Booking Confirmation -->
      </div>
      <!-- Pagination -->
      <div class="flex flex-col items-center mt-6 pagination">
        <span class="text-xs text-gray-700">
          Showing
          <span id="startEntry" class="font-semibold text-gray-900">1</span> to
          <span id="endEntry" class="font-semibold text-gray-900">0</span> of
          <span id="totalEntries" class="font-semibold text-gray-900">0</span>
          Notifications
        </span>
        <div class="inline-flex mt-2">
          <button
            id="prevPage"
            class="flex items-center justify-center px-4 h-6 text-xs font-medium text-white customBg rounded hover:bg-gray-300 me-2"
          >
            Prev
          </button>
          <button
            id="nextPage"
            class="flex items-center justify-center px-4 h-6 text-xs font-medium text-white customBg border-l border-gray-300 rounded hover:bg-gray-300"
          >
            Next
          </button>
        </div>
      </div>
    </div>
    <script>
      document.querySelector(".pagination").classList.add("hidden");

      if (localStorage.getItem("token") != null) {
        document.getElementById(
          "userLoggedIn"
        ).innerHTML = `<a href="notifications.html" id="notificationBadge"></a><a href="notifications.html" class="me-3 position-relative inline-block">
  
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
  </svg>
</a>
        <a href="chat.html"  id="messageBadge"><a href="chat.html" class="me-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      </svg>
      </a>
      <a class="cursor-pointer me-4" ${
        localStorage.getItem("type") == "customer"
          ? `href="customer/customerDashboard.html"`
          : `href="service-provider/spDashboard.html"`
      }
      }><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9M15 17V5M21 17V12" />
      </svg>
       </a>
      <a href="home.html"
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800"
        id="logoutBtn">
        Logout
      </a>`;
      }

      if (localStorage.getItem("token") == null) {
        document.getElementById("userLoggedIn").innerHTML = `
      <a href="index.html"
        class="text-gray-800 light:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Login
      </a>
      <a href="register.html"
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Sign up
      </a>`;
