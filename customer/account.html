        </div>

        >
          <ul
            class="flex flex-col mt-4 md:flex-row md:mt-0 md:space-x-8 rtl:space-x-reverse"
          >
            <li>
              <a
                href="/home.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-gray-500 md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                aria-current="page"

            </li>
            <li>
              <a
                href="/aboutUs.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"

              >
            </li>
            <li>
              <a
                href="/serviceProviders.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                >Service Providers</a
              >
            </li>
            <li>
              <a
                href="/contactUs.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"

            <li>
              <a

                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"

              >
            </li>

      </div>
    </nav>
    <!-- second navbar -->
    <nav class="bg-white border-1 border-gray-200 light:bg-gray-900">
      <div
        class="flex flex-wrap items-center justify-center max-w-screen-xl mx-auto p-4"
      >
        <div
          id="mega-menu"
          class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
        >
          <ul
            class="flex flex-col mt-4 font-medium md:flex-row md:mt-0 md:space-x-24 rtl:space-x-reverse"
          >
            <li>
              <a
                href="customerDashboard.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-gray-500 md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                aria-current="page"
                >Dashboard</a
              >
            </li>
            <li>
              <a
                href="smartBudgeting.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                >Budget</a
              >
            </li>

            <li>
              <a
                href="customerBooking.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                >Bookings</a
              >
            </li>
            <li>
              <a
                href="events.html"
                class="block py-2 px-3 text-gray-900 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                >My Events</a
              >
            </li>
            <li>
              <a
                href="account.html"
                class="block py-2 px-3 customTextColor font-bold border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 light:text-white md:light:hover:text-gray-500 light:hover:bg-gray-700 light:hover:text-gray-500 md:light:hover:bg-transparent light:border-gray-700"
                >Manage Account</a

        </div>
      </div>

    <div
      class="fixed inset-0 flex justify-center items-center bg-white z-50 hidden"
      id="loader"
    >
      <div class="spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <!-- content -->
    <div class="max-w-5xl mx-auto p-6 bg-white rounded-lg">
      <!-- Page Title -->
      <h2 class="text-lg font-semibold text-gray-900 mb-6">
        Profile & Account Settings
      </h2>

      <!-- Business Details Section -->
      <div class="p-6 rounded-lg shadow-md border border-gray-300 mb-6">
        <h3 class="text-md font-semibold mb-4">Update Personal Details</h3>
        <form id="update_info_form">
          <!-- display image  -->
          <div class="flex justify-center items-center">
            <img
              id="display_image"
              class="w-32 h-32 rounded-full object-cover shadow-md"
              src="/src/imgs/G.png"
              alt="Profile Image"
            />
          </div>

          <!-- input for image -->
          <div class="flex justify-center items-center mt-2">
            <label class="block mb-2 text-sm text-gray-900"
              >Profile Picture</label
            >
          </div>

          <div class="flex justify-center items-center mb-4">
            <div class="flex flex-col items-center">
              <label
                for="profile_image"
                class="cursor-pointer customBg hover:bg-blue-600 text-white text-sm font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-4 h-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"
                  />
                </svg>

                Upload Image
              </label>
              <input
                type="file"
                id="profile_image"
                name="profile_picture"
                accept="image/*"
                class="hidden"
                onchange="updateFileName(event)"
              />
              <span id="file_name" class="mt-2 text-sm text-gray-600"></span>
            </div>
          </div>
          <div>
            <label class="block mb-2 text-sm text-gray-900">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Full Name"
              required
            />
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block mb-2 text-sm text-gray-900"
                >Email (used for login)</label
              >
              <input
                type="email"
                id="email"
                name="email"
                class="w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter Email"
                required
              />
            </div>
            <div>
              <label class="block mb-2 text-sm text-gray-900"
                >Phone number</label
              >
              <input
                type="text"
                id="phone_number"
                name="phone_number"
                class="w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter Phone Number"
                required
              />
            </div>
          </div>

          <div class="flex justify-end">
            <button
              class="mt-4 text-sm customBg text-white px-3 py-2 rounded-md shadow-md hover:bg-blue-700"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>

      <!-- Change Password Section -->
      <div class="p-6 rounded-lg shadow-md border border-gray-300 mb-6">
        <h3 class="text-md font-semibold mb-4">Change Password</h3>

        <div>
          <label class="block mb-2 text-sm text-gray-900"
            >Current Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="currentPassword"
              name="currentPassword"
              class="w-full border border-gray-300 mb-4 rounded-lg focus:ring-blue-500 focus:border-blue-500 pr-10"
              placeholder="Enter Current Password"
              required
            />
            <span
              class="absolute inset-y-0 right-3 bottom-3 flex items-center cursor-pointer text-gray-500"
              onclick="togglePassword('currentPassword', this)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-2 text-sm text-gray-900">New Password</label>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                class="w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 pr-10"
                placeholder="Enter New Password"
                required
              />
              <span
                class="absolute inset-y-0 right-3 flex items-center cursor-pointer text-gray-500"
                onclick="togglePassword('password', this)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  />
                </svg>
              </span>
            </div>
          </div>
          <div>
            <label class="block mb-2 text-sm text-gray-900"
              >Confirm New Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="confirmNewPassword"
                name="password_confirmation"
                class="w-full border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 pr-10"
                placeholder="Confirm New Password"
                required
              />
              <span
                class="absolute inset-y-0 right-3 flex items-center cursor-pointer text-gray-500"
                onclick="togglePassword('confirmNewPassword', this)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  />
                </svg>
              </span>
            </div>
          </div>
        </div>

        <div class="flex justify-end">
          <button
            class="mt-4 text-sm bg-red-600 text-white px-3 py-2 rounded-md shadow-md hover:bg-red-700"
          >
            Update Password
          </button>
        </div>
      </div>
    </div>

    <script>
      function togglePassword(fieldId, icon) {
        const passwordField = document.getElementById(fieldId);
        if (passwordField.type === "password") {
          passwordField.type = "text";
          icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
</svg>
`;
        } else {
          passwordField.type = "password";
          icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
</svg>`;
        }
      }
    </script>

    <script>
      if (localStorage.getItem("token") != null) {
        document.getElementById(
          "userLoggedIn"
        ).innerHTML = `<a href="../notifications.html"  id="notificationBadge"></a><a href="../notifications.html" class="me-3 position-relative inline-block">
  
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
  </svg>
</a>
        <a href="/chat.html"  id="messageBadge"><a href="/chat.html" class="me-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      </svg>
      </a>
      <a    class="cursor-pointer me-4" ${
        localStorage.getItem("type") == "customer"
          ? `href="customerDashboard.html"`
          : `href="serviceprovider/serviceProviderDashboard.html"`
      }
      }><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9M15 17V5M21 17V12" />
      </svg>
       </a>
      <button
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300  rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800"
        id="logoutBtn">
        Logout
      </button>`;
      }

      if (localStorage.getItem("token") == null) {
        document.getElementById("userLoggedIn").innerHTML = `
      <a href="index.html"
        class="text-gray-800 light:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300  rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Login
      </a>
      <a href="register.html"
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300  rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Sign up
      </a>`;
      }
    </script>
    <script>
      function updateFileName(event) {
        const fileNameDisplay = document.getElementById("file_name");
        if (event.target.files.length > 0) {
          fileNameDisplay.textContent = event.target.files[0].name;
          const file = event.target.files[0];

          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              const preview = document.getElementById("display_image");
              preview.src = e.target.result;
              preview.classList.remove("hidden");
            };
            reader.readAsDataURL(file);
          }
        } else {
          fileNameDisplay.textContent = "";
        }
      }

      function uploadLogo(event) {}
    </script>
  </body>
</html>
