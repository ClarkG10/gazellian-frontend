  <body>
    <div
      class="fixed inset-0 flex justify-center items-center bg-white z-50 hidden"
      id="loader"
    >
      <div class="spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- confirmation modal -->
    <div
      id="confirmationModal"
      class="fixed hidden z-100 w-full h-fit-content flex justify-center fade-up"
    >
      <div class="w-1/8 max-w-md customBg rounded-xl mt-10 shadow-xl">
        <div class="flex justify-center items-center mb-3">
          <h4 class="text-xs font-bold text-white pt-4 flex justify-between">
            Booking Request Sent
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5 ms-1 pb-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </h4>
        </div>
      </div>
    </div>
    <!-- confirmation modal -->
    <div
      id="bookingModal"
      class="fixed hidden z-100 w-full h-full flex items-center justify-center"
      style="
        /* background-color: black; */
        background: rgba(95, 95, 95, 0.5); /* Black with 50% opacity */
      "
    >
      <div class="w-1/4 max-w-md p-6 bg-white rounded-xl">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-md font-bold text-gray-900">Book a Service</h3>
          <button
            class="flex items-center justify-center px-2 h-6 text-xs rounded-full font-medium text-gray-700 hover:bg-gray-300"
            onclick="closeBookingModal()"
          >
            X
          </button>
        </div>
        <div class="mt-2">
          <form id="booking_form">
            <div>
              <label
                for="servicesOptions"
                class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
              >
                Service
              </label>
              <select
                id="servicesOptions"
                name="service_id"
                class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
                required
              ></select>
              <label
                for="eventOptions"
                class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
              >
                Event
              </label>
              <select
                id="eventOptions"
                name="event_id"
                class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
                required
              ></select>
              <!-- event date input -->
              <label
                for="eventDate"
                class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
              >
                Booking Date
              </label>
              <input
                type="date"
                id="eventDate"
                name="event_date"
                class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
                required
              />
              <label
                for="request_amount"
                class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
              >
                Request an Amount
              </label>
              <input
                type="number"
                id="request_amount"
                name="requested_amount"
                class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
                placeholder="Enter an amount"
                required
              />
            </div>

            <!-- textarea for note -->
            <label
              for="note"
              class="block mb-2 text-sm font-medium text-gray-900 light:text-white"
            >
              Note (optional)
            </label>
            <textarea
              id="note"
              name="note"
              class="mb-4 block w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 h-32 p-2.5 light:bg-gray-700 light:border-gray-600 light:placeholder-gray-400 light:text-white light:focus:ring-blue-500 light:focus:border-blue-500"
            ></textarea>
            <!-- button book now -->
            <button
              type="submit"
              class="w-full py-2 text-sm font-medium text-white rounded-lg customBg"
              id="bookingButton"
            >
              Book Now
            </button>
          </form>
        </div>
      </div>
    </div>

       </a>

        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Logout
      </button>`;
      }

      if (localStorage.getItem("token") == null) {
        document.getElementById("userLoggedIn").innerHTML = `
      <a href="index.html"
        class="text-gray-800 light:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800 me-2">
        Login
      </a>
      <a href="register.html"
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Sign up
      </a>`;
      }
    </script>
    <script>
      if (localStorage.getItem("token") != null) {
        const backendURL = "http://gazellian.test";

        const BOOK_CACHE_NAME = "booking-cache";
        const CUSTOMERBOOKING_URL = backendURL + "/api/booking/customer/index";
        const SPBOOKING_URL = backendURL + "/api/booking/provider/index";

        const apiUrl =
          localStorage.getItem("type") === "customer"
            ? CUSTOMERBOOKING_URL
            : SPBOOKING_URL;

        // Function to fetch and cache booking data
        async function fetchBooking() {
          try {
            const cache = await caches.open(BOOK_CACHE_NAME);

            const response = await fetch(apiUrl, {
              headers: {
                Accept: "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
            });

            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const bookingData = await response.json();
            await cache.put(apiUrl, new Response(JSON.stringify(bookingData)));
          } catch (error) {
            console.error("Error fetching booking data:", error);
          }
        }

        document.addEventListener("DOMContentLoaded", async () => {
          const serviceContainer = document.getElementById("service_container");
          const serviceOptions = document.getElementById("servicesOptions");

          const CACHE_NAME = "service-provider-cache";
          const SERVICE_PROVIDER_URL = backendURL + "/api/service-provider";

          const cache = await caches.open(CACHE_NAME);
          const cachedSP = await cache.match(SERVICE_PROVIDER_URL);
          if (!cachedSP) return;

          window.spDatas = await cachedSP.json();
        });

        function openBookingModal(id) {
          const serviceOptions = document.getElementById("servicesOptions");
          serviceOptions.innerHTML =
            '<option value="">Select a service</option>';

          const sp = window.spDatas.find((sp) => sp.id == id);

          if (!sp) return;

          sp.services.forEach((service) => {
            const option = document.createElement("option");
            option.value = service.id;
            option.textContent = service.service_name;
            serviceOptions.appendChild(option);
          });

          document.getElementById("bookingModal").classList.remove("hidden");

          const booking_form = document.getElementById("booking_form");
          const confirmationModal =
            document.getElementById("confirmationModal");

          booking_form.onsubmit = async (e) => {
            e.preventDefault();

            const formData = new FormData(booking_form);
            booking_form.querySelector("button").innerText = `Booking...`;

            booking_form.querySelectorAll("button").disabled = true;

            const bookingData = {
              provider_id: id,
              customer_id: 1,
              event_id: formData.get("event_id"),
              service_id: formData.get("service_id"),
              booking_date: formData.get("event_date"),
              requested_amount: formData.get("requested_amount"),
              note: formData.get("note"),
            };

            const bookingResponse = await fetch(backendURL + "/api/booking", {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
              body: JSON.stringify(bookingData),
            });

            // throw error
            if (!bookingResponse.ok)
              throw new Error(await bookingResponse.text());

            booking_form.reset();

            booking_form.querySelector("button").innerText = `Book Now`;
            booking_form.querySelectorAll("button").disabled = false;
            await fetchBooking();

            const data = {
              type: "booking",
              header_text: "New Booking Request",
              message: "A new booking has been made for you",
              user_id: id,
            };

            sendNotification(data);
            closeBookingModal();
          };

          function closeBookingModal() {
            document.getElementById("bookingModal").classList.add("hidden");
            confirmationModal.classList.remove("hidden");

            setTimeout(() => {
              confirmationModal.classList.add("hidden");
            }, 2000);
          }
        }

        function closeBookingModal() {
          document.getElementById("bookingModal").classList.add("hidden");
        }

        async function sendNotification(data) {
          console.log(data);
          const response = await fetch(backendURL + "/api/notification", {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
            body: JSON.stringify(data),
          });
          if (!response.ok) throw new Error(await response.text());
          console.log("Notification sent successfully");
        }
      }
    </script>
  </body>
</html>
