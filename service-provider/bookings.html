    <!-- content -->
    <div class="max-w-7xl mx-auto p-6 bg-white shadow-lg rounded-lg">
      <!-- Page Title -->
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-semibold text-gray-900">Booking Requests</h2>
      </div>

      <!-- Filters -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <input
          type="text"
          id="searchBooking"
          placeholder="Search bookings..."
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
          oninput="filterBookings()"
        />
        <select
          id="filterStatus"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
          onchange="filterBookings()"
        >
          <option value="">Filter by Status</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
        </select>
      </div>

      <!-- Booking Requests Table -->
      <div class="overflow-x-auto">
        <table
          class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm"
        >
          <thead class="bg-gray-100 text-gray-700 border-b">
            <tr>
              <th class="py-4 px-6 text-left">Customer Name</th>
              <th class="py-4 px-6 text-left">Service</th>
              <th class="py-4 px-6 text-left">Event Date</th>
              <th class="py-4 px-6 text-left">Status</th>
              <th class="py-4 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="bookingTableBody">
            <!-- Example Booking Request -->
            <tr class="border-b hover:bg-gray-50">
              <td class="py-4 px-6 font-medium text-gray-800">John Doe</td>
              <td class="py-4 px-6">Wedding Photography</td>
              <td class="py-4 px-6">April 15, 2024</td>
              <td class="py-4 px-6">
                <span
                  class="px-3 py-1 bg-yellow-200 text-yellow-700 rounded-full text-xs font-semibold"
                  >Pending</span
                >
              </td>
              <td class="py-4 px-6 flex justify-center space-x-3">
                <button
                  class="bg-green-500 text-white px-4 py-2 rounded-md shadow-md hover:bg-green-600 flex items-center gap-1"
                  onclick="acceptBooking(this)"
                >
                  ✅ Accept
                </button>
                <button
                  class="bg-red-500 text-white px-4 py-2 rounded-md shadow-md hover:bg-red-600 flex items-center gap-1"
                  onclick="declineBooking(this)"
                >
                  ❌ Decline
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      function acceptBooking(button) {
        let row = button.closest("tr");
        row.children[3].innerHTML =
          '<span class="px-3 py-1 bg-green-200 text-green-700 rounded-full text-xs font-semibold">Accepted</span>';
        row.children[4].innerHTML = ""; // Remove buttons after accepting
      }

      function declineBooking(button) {
        let row = button.closest("tr");
        row.children[3].innerHTML =
          '<span class="px-3 py-1 bg-red-200 text-red-700 rounded-full text-xs font-semibold">Declined</span>';
        row.children[4].innerHTML = ""; // Remove buttons after declining
      }

      function filterBookings() {
        let search = document
          .getElementById("searchBooking")
          .value.toLowerCase();
        let status = document.getElementById("filterStatus").value;
        let rows = document.querySelectorAll("#bookingTableBody tr");

        rows.forEach((row) => {
          let customerName = row.children[0].textContent.toLowerCase();
          let bookingStatus = row.children[3].textContent.toLowerCase();

          let matchesSearch = customerName.includes(search);
          let matchesStatus = status === "" || bookingStatus.includes(status);

          row.style.display = matchesSearch && matchesStatus ? "" : "none";
        });
      }
    </script>

    <script>
      if (localStorage.getItem("token") != null) {
        document.getElementById(

        ).innerHTML = `<a href="../notifications.html"  id="notificationBadge"></a><a href="../notifications.html" class="me-3 position-relative inline-block">

    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
  </svg>
</a>
        <a href="/chat.html"  id="messageBadge"><a href="/chat.html" class="me-4">

      </svg>
      </a>
      <a    class="cursor-pointer me-4" ${
        localStorage.getItem("type") == "customer"
          ? `href="customerDashboard.html"`
          : `href="serviceprovider/serviceProviderDashboard.html"`
      }
      }><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 17V9M15 17V5M21 17V12" />
      </svg>
       </a>
      <button
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Logout
      </button>`;
      }

      if (localStorage.getItem("token") == null) {
        document.getElementById("userLoggedIn").innerHTML = `
      <a href="index.html"
        class="text-gray-800 light:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Login
      </a>
      <a href="register.html"
        class="text-white customBg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 light:bg-gray-600 light:hover:bg-gray-700 focus:outline-none light:focus:ring-gray-800">
        Sign up
      </a>`;
      }
    </script>
