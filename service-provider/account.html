            <li>

            <li>

    <!-- content -->
    <div class="max-w-5xl mx-auto p-6 bg-white shadow-lg rounded-lg">
      <!-- Page Title -->
      <h2 class="text-3xl font-semibold text-gray-900 mb-6">
        Profile & Account Settings
      </h2>

      <!-- Business Details Section -->
      <div class="bg-gray-100 p-6 rounded-lg shadow-sm mb-6">
        <h3 class="text-xl font-semibold mb-4">Update Business Details</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Business Name</label
            >
            <input
              type="text"
              id="businessName"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Business Name"
            />
          </div>
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Business Email</label
            >
            <input
              type="email"
              id="businessEmail"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Business Email"
            />
          </div>
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Business Phone</label
            >
            <input
              type="text"
              id="businessPhone"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Phone Number"
            />
          </div>
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Location</label
            >
            <input
              type="text"
              id="businessLocation"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Location"
            />
          </div>
        </div>

        <button
          class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-md shadow-md hover:bg-blue-700"
        >
          Save Changes
        </button>
      </div>

      <!-- Change Password Section -->
      <div class="bg-gray-100 p-6 rounded-lg shadow-sm mb-6">
        <h3 class="text-xl font-semibold mb-4">Change Password</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Current Password</label
            >
            <input
              type="password"
              id="currentPassword"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter Current Password"
            />
          </div>
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >New Password</label
            >
            <input
              type="password"
              id="newPassword"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Enter New Password"
            />
          </div>
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900"
              >Confirm New Password</label
            >
            <input
              type="password"
              id="confirmNewPassword"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500"
              placeholder="Confirm New Password"
            />
          </div>
        </div>

        <button
          class="mt-4 bg-red-600 text-white px-5 py-2 rounded-md shadow-md hover:bg-red-700"
        >
          Update Password
        </button>
      </div>
    </div>

    <script>
      function previewLogo(event) {
        let reader = new FileReader();
        reader.onload = function () {
          document.getElementById("logoPreview").src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }

      function previewImages(event) {
        let gallery = document.getElementById("gallery");
        gallery.innerHTML = ""; // Clear gallery before adding new images

        Array.from(event.target.files).forEach((file) => {
          let reader = new FileReader();
          reader.onload = function () {
            let imgElement = document.createElement("img");
            imgElement.src = reader.result;
            imgElement.classList.add(
              "w-full",
              "h-32",
              "object-cover",
              "rounded-lg",
              "border",
              "border-gray-300"
            );
            gallery.appendChild(imgElement);
          };
          reader.readAsDataURL(file);
        });
      }
    </script>

    <script>
      if (localStorage.getItem("token") != null) {
        document.getElementById(

  </svg>
</a>
        <a href="/chat.html"  id="messageBadge"><a href="/chat.html" class="me-4">

      <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      </svg>
      </a>
      <a    class="cursor-pointer me-4" ${
        localStorage.getItem("type") == "customer"
          ? `href="customerDashboard.html"`

      if (localStorage.getItem("token") == null) {
