<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <title>Document</title>
  </head>
  <body>
    <div id="calendar" style="width: 300px"></div>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const calendarEl = document.getElementById("calendar");
        const backendURL = "http://gazellian.test";

        // Fetch booked dates from your API
        async function fetchBookedDates() {
          try {
            const response = await fetch(backendURL + "/api/booking", {
              method: "GET",

              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
            });
            if (!response.ok) throw new Error("Failed to fetch bookings");

            const bookings = await response.json();

            console.log(bookings);

            // Convert bookings into events for FullCalendar
            return bookings.map((booking) => ({
              title: "Booked", // Label for booked dates
              start: booking.booking_date,
              allDay: true,
              backgroundColor: "#ff3b30", // Red color for booked dates
              textColor: "#fff",
            }));
          } catch (error) {
            console.error("Error fetching booked dates:", error);
            return [];
          }
        }

        // Initialize FullCalendar
        async function initializeCalendar() {
          const bookedDates = await fetchBookedDates(); // Get booked dates
          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth", // Month view
            events: bookedDates, // Add booked dates
          });

          calendar.render();
        }

        initializeCalendar();
      });
    </script>
  </body>
</html>
